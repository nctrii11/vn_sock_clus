[project]
name = "vn50-cluster-markowitz"
version = "0.1.0"
description = "VN50/VN30 clustering + Markowitz mean-variance optimization"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pytest>=7.4",
    "vnstock==0.2.9.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "black>=24.0",
    "pre-commit>=3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

